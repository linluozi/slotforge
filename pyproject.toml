[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slotforge"
version = "0.1.0"
description = "Measure, rewrite, certify and roll back __slots__ patches on real Python packages"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "linluozi"}]

[project.scripts]
slotforge = "slotforge.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["slotforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
